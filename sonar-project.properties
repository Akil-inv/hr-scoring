sonar.projectKey=Hackathon_judge_platform
sonar.projectName=Hackathon Platform
sonar.sourceEncoding=UTF-8
sonar.sources=apps/api/src,apps/web/src,apps/scheduler/src,packages/shared
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/.venv/**,**/coverage/**,**/__pycache__/**

# Tests are excluded from sources above, so point Sonar at them explicitly —
# otherwise it reports a project with no tests and no coverage.
sonar.tests=apps/api/src,apps/api/test,apps/scheduler/tests
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/test_*.py

# Coverage reports. Written by `npm run test:cov`.
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info
sonar.typescript.lcov.reportPaths=apps/api/coverage/lcov.info
