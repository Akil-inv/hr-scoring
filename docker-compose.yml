# HR Scoring stack.
#
# Runs on the same EC2 server as the live hackathon platform, so it is built to
# stay out of that platform's way:
#   - its own Compose project name, so containers, networks and volumes are all
#     prefixed hr-scoring_ and never collide with the live stack
#   - its own Postgres and volume
#   - no ports published on the host: the only way in is the Tailscale
#     container, which gives the stack a private HTTPS address on the tailnet
#   - memory limits sized so both stacks fit on one machine
#
# nginx shares the Tailscale container's network namespace
# (network_mode: service:tailscale). Tailscale serves HTTPS on the tailnet and
# proxies to nginx on 127.0.0.1:80 inside that namespace. That port 80 is not
# the host's port 80, which the live platform keeps.

name: hr-scoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    logging: *logging
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: hackathon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hackathon"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hackathon:${DB_PASSWORD}@postgres:5432/hackathon?connection_limit=10&pool_timeout=20
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      NODE_ENV: production
      SCHEDULER_URL: http://scheduler:8001
      AWS_REGION: ap-southeast-1
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-}
      JUDGE_TOKEN_SALT: ${JUDGE_TOKEN_SALT:?set JUDGE_TOKEN_SALT in .env}
      # Field encryption: the AWS KMS key (ARN or alias/...). Blank = off.
      KMS_KEY_ID: ${KMS_KEY_ID:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Still needed for events set up through the wizard. Events set up by Excel
  # upload never call it.
  scheduler:
    build:
      context: ./apps/scheduler
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-hr-scoring}
    mem_limit: 128m
    logging: *logging
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun and no NET_ADMIN capability on a
      # server that also runs the live platform.
      TS_USERSPACE: "true"
    volumes:
      - tsstate:/var/lib/tailscale
      - ./tailscale:/config:ro

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
    network_mode: service:tailscale
    depends_on:
      - tailscale
      - web
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  tsstate:
